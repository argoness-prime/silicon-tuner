[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-tuner-core"
version = "1.1.0"
description = "Zero-dependency GQA KV-cache and Mixture-of-Experts (--n-cpu-moe) GPU VRAM + System DDR5 RAM budget calculator and stdio MCP server for local LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Veristrux Inc.", email = "argoness@veristrux.com"}]
keywords = ["local-llm", "vram-calculator", "moe", "gqa", "mcp", "mcp-server", "llama-cpp", "ollama", "vllm"]

[project.urls]
Homepage = "https://veristrux.com/"
Repository = "https://github.com/argoness-prime/silicon-tuner"

[project.scripts]
silicon-tuner-core = "silicon_tuner_core.cli:main"
silicon-tuner-mcp = "silicon_tuner_core.mcp_server:main"

[tool.setuptools.packages.find]
include = ["silicon_tuner_core*"]
